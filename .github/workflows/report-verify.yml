# Report rendering gate for the client report v3 rebuild.
#
# The repo had no CI. The coach report is rendered from modules the client rebuild edits
# (renderer.js, report_prep.js, buildEnneagramSVG, partAStyles) and nothing in the test
# suite asserts on its output, so "did this client change alter the coach report?" was
# answerable only by remembering to check. This workflow answers it on every PR.
#
# The runner is deliberately Linux, not macOS. On macOS, Arial is present AND is the
# default sans-serif, so a missing-font bug is invisible there. Production runs Linux,
# where a stock image has neither Arial nor Helvetica and Chromium substitutes a
# metrically different face — design spec v3.0 section 3.3 calls this the most likely
# cause of a page silently becoming two sheets. CI installs the same Liberation Sans that
# nixpacks.toml installs, so runner, container and production agree.

name: report-verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Metric-compatible with Arial: identical advance widths, so line breaks land in the
      # same places the report was measured against.
      #
      # THE THIRD-PARTY APT LISTS ARE REMOVED FIRST, AND THIS IS NOT A WORKAROUND — IT REMOVES
      # A DEPENDENCY THE BUILD NEVER HAD. On 9 Sep 2026 five consecutive runs died here, before
      # a single gate executed, on:
      #
      #   E: Failed to fetch https://dl.google.com/linux/chrome-stable/.../Packages.gz
      #      Hash Sum mismatch
      #
      # Google had published a Packages.gz that did not match its own Release file. `apt-get
      # update` refreshes EVERY configured list and returns 100 if any one of them fails, so a
      # repository this workflow does not use took the whole job down and every gate was
      # SKIPPED — a PR that told us nothing about the work in it.
      #
      # MEASURED, not assumed: the only package this workflow installs is fonts-liberation,
      # which comes from the Ubuntu archive. Chromium does NOT come from Google's apt repo — it
      # is puppeteer 24.42.0's bundled binary (app/browser_launch.js launches
      # `require('puppeteer')`), restored from the ~/.cache/puppeteer cache above. The runner
      # image pre-configures Google's list, and several others, for builds that are not this one.
      #
      # ONLY `*.list` IS REMOVED, DELIBERATELY. Third-party repositories the runner image adds
      # use the classic one-line `.list` format; Ubuntu's own archive is either
      # /etc/apt/sources.list or a deb822 `.sources` file, and neither matches that glob. Removing
      # `*.sources` too would break apt outright.
      #
      # THE LOG IS THE EVIDENCE. The lists are printed before and after, so a future reader can
      # see exactly what was dropped rather than trusting this comment. `apt-get update` stays
      # FATAL: with the third-party lists gone, a failure is the Ubuntu archive itself, which is
      # worth stopping for. And if this ever removes too much, `apt-get install` fails loudly on
      # the next line — a visible failure, not a silent one.
      - name: Install Liberation Sans
        run: |
          echo "── apt lists before ──"; ls -1 /etc/apt/sources.list.d/ 2>/dev/null || echo "(none)"
          sudo rm -f /etc/apt/sources.list.d/*.list
          echo "── apt lists after ──";  ls -1 /etc/apt/sources.list.d/ 2>/dev/null || echo "(none)"
          sudo apt-get update
          sudo apt-get install -y fonts-liberation

      # Chromium is pinned by the lockfile (puppeteer 24.42.0 -> Chromium 147.0.7727.57).
      - name: Cache Puppeteer browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        working-directory: app

      # HARD FAIL: unit + integration tests, including the page-structure inventory.
      - name: Unit and integration tests
        run: npm test
        working-directory: app

      # HARD FAIL: client single-sheet contract, page counts, and the font-resolution
      # assertion (fires before any measurement is trusted).
      - name: Render check — single sheet, page counts, font resolution
        run: npm run verify:render
        working-directory: app

      # HARD FAIL: all 18 diagrams — no clipping, no label-label or label-node overlap,
      # and >= 5px edge clearance measured from real getBBox() boxes. Content changes
      # (a longer archetype name) cannot quietly break the geometry.
      - name: Diagram geometry gate
        run: node scripts/verify_diagrams.js

      # HARD FAIL: zero transparency groups / soft masks / alpha < 1 in the emitted client
      # PDF. Design spec section 3.2 calls this invariant document-wide, but nothing had ever
      # enforced it — the cover is the page that rendered PINK in one viewer because of it.
      # The step runs its own positive control first: it renders a deliberately BAD page and
      # requires the scanner to FIND the violation, so a detector that silently stops working
      # fails loudly instead of passing everything.
      - name: Transparency gate
        run: node scripts/verify_transparency.js

      # HARD FAIL: coach HTML byte-identical + normalized coach PDF hash unchanged.
      # The PDF hash catches rendering regressions that leave markup and page heights
      # intact — colour above all, which is the bug class section 3.2 exists for.
      - name: Coach report regression gate
        run: node scripts/verify_coach_baseline.js

      # HARD FAIL: the content library invariant — the committed JSON must equal a build
      # of the Word source. This is what keeps Word canonical: it fails in the PR that
      # edits the JSON directly, and it catches a docx edited but never rebuilt, which the
      # old build-time guard could not see.
      - name: Content library reproducibility
        run: node scripts/verify_content_library.js
